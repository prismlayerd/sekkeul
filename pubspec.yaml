name: secul
description: 세끌 — 직장인·프리랜서·N잡러를 위한 온디바이스 종합소득세·연말정산 도우미 (민감정보는 기기에만 저장)
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  # ① 연말정산 자료 파서 — PDF 텍스트 추출(순수 Dart) + 파일 선택
  syncfusion_flutter_pdf: ^28.1.33
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  # 양식 탭 — 번들 PDF를 임시 파일로 내보내 공유
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/forms/
    - assets/textures/
  # 영수증 테마는 전부 고정폭이다. 라틴·숫자는 IBM Plex Mono,
  # 한글은 Nanum Gothic Coding으로 떨어진다(app_theme의 fontFamilyFallback).
  # DM Serif / DM Sans / Noto Serif KR은 v5.1에서 뺐다 — NotoSerifKR 하나가
  # 23MB였다. 파일은 design/make_feature_graphic.py가 아직 쓰므로 남겨 둔다.
  fonts:
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
    - family: Nanum Gothic Coding
      fonts:
        - asset: assets/fonts/NanumGothicCoding-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumGothicCoding-Bold.ttf
          weight: 700

# 앱 아이콘 — 블루프린트 정체성: '세' + 도면 치수선. 콘크리트 바탕 #F8F7F5.
# 생성: dart run flutter_launcher_icons (원본: design/icon_final.png)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # 적응형 아이콘: 잉크 바탕 + 종이 물결(전경). 전경의 띠는 안쪽 66%
  # 안전 영역 안에 들어가 있어 어떤 기기 마스크로 잘려도 안 깎인다.
  adaptive_icon_background: "#1F1F1F"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true
