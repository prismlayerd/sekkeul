name: secul
description: 세끌 — 직장인·프리랜서·N잡러를 위한 온디바이스 종합소득세·연말정산 도우미 (민감정보는 기기에만 저장)
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path: ^1.9.0
  intl: ^0.20.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  # ① 연말정산 자료 파서 — PDF 텍스트 추출(순수 Dart) + 파일 선택
  syncfusion_flutter_pdf: ^28.1.33
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  # 양식 탭 — 번들 PDF를 임시 파일로 내보내 공유
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/forms/
  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: Noto Serif KR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Variable.ttf

# 앱 아이콘 — 블루프린트 정체성: '세' + 도면 치수선. 콘크리트 바탕 #F8F7F5.
# 생성: dart run flutter_launcher_icons (원본: design/icon_final.png)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
